# Configuração adicional do RabbitMQ (montada em /etc/rabbitmq/conf.d/20-topologia.conf).
# Carrega a topologia (exchanges, filas, DLX/DLQs e bindings) do definitions.json na inicialização.
# O arquivo é gerado no start do container por render-definitions.sh, que junta o usuário
# administrador (RABBITMQ_USER/RABBITMQ_PASS do .env) com a topologia de definitions.template.json.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
